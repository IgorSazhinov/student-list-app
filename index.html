<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Список сотрудников проекта</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Фильтр по фамилии..." class="search-input">
            <button id="resetFilter" class="btn-reset">Сбросить фильтр</button>
        </div>
        
        <div class="stats" id="stats">
            Всего студентов: <span id="totalCount">0</span>
        </div>
        
        <ul id="studentList" class="student-list"></ul>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
